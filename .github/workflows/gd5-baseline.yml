name: GD5.0 baseline - build and unit regression
on:
  push:
    branches:
      - feat/footballbooking-gd0-gd4
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gd5-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FootballBooking.slnx
      - name: Build
        run: dotnet build FootballBooking.slnx -c Release --no-restore
      - name: Unit regression (no MySQL)
        run: dotnet test tests/FootballBooking.Tests/FootballBooking.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName!~FootballBooking.Tests.Integration' --logger 'console;verbosity=normal'
